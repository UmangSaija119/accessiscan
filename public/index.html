<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="AccessiScan - AI-Powered Accessibility Testing Platform. Test your website for WCAG compliance instantly.">
  <title>AccessiScan by Astound Digital — AI Accessibility Testing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- App Shell -->
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-universal-access"></i>
          </div>
          <span class="logo-text">AccessiScan<span class="brand-sub">by Astound Digital</span></span>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="#/scan" class="nav-item" data-page="scan">
          <i class="fas fa-search"></i>
          <span>New Scan</span>
        </a>
        <a href="#/history" class="nav-item" data-page="history">
          <i class="fas fa-clock-rotate-left"></i>
          <span>History</span>
        </a>
        <a href="#/settings" class="nav-item" data-page="settings">
          <i class="fas fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="user-details">
            <span id="user-name" class="user-name">User</span>
            <span id="user-email" class="user-email">user@email.com</span>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn" title="Logout">
          <i class="fas fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <div id="page-content" class="page-content">
        <!-- Dynamic page content injected here -->
      </div>
    </main>
  </div>

  <!-- Auth Container (shown when not logged in) -->
  <div id="auth-container" class="auth-container" style="display:none;">
    <div class="auth-bg">
      <div class="auth-orb auth-orb-1"></div>
      <div class="auth-orb auth-orb-2"></div>
      <div class="auth-orb auth-orb-3"></div>
    </div>
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon large">
          <i class="fas fa-universal-access"></i>
        </div>
        <h1>Accessi<span class="brand-highlight">Scan</span></h1>
        <p>AI-Powered Accessibility Testing</p>
        <div class="brand-badge">by Astound Digital</div>
      </div>

      <div id="auth-form-container">
        <!-- Login / Register form injected here -->
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/pages/login.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/scan.js"></script>
  <script src="/js/pages/report.js"></script>
  <script src="/js/pages/history.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
